[project]
name = "hindu-texts-ingest"
version = "0.1.0"
description = "PDF ingestion pipeline that normalizes Hindu scriptures and literature into the app content schema"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24", "pdfplumber>=0.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hindu-texts-ingest = "hindu_texts_ingest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hindu_texts_ingest*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
